<p-panel header="Consultar Casos">
  <app-tabla-dinamica
    [columnas]="columnas"
    [datos]="data()"
    [loading]="loading()"
    [showActions]="true"
    [acciones]="acciones"
    [selectable]="true"
    selectionMode="multiple"
    dataKey="idRadicado"
    (accionEjecutada)="onAccion($event)" />
</p-panel>

<app-modal-caso
  [visible]="showModal()"
  (onClose)="closeModal()" />
