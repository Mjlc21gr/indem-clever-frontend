<p-fieldset legend="Información del Siniestro" [toggleable]="true">
  <p-fluid>
    <section class="form-grid form-grid--full">
      <label>CUC. Concepto
        <textarea pTextarea [ngModel]="cucConceptoGeneral()" (ngModelChange)="cucConceptoGeneral.set($event)" rows="1"></textarea>
      </label>
      <label>Cobertura Principal
        <textarea pTextarea [ngModel]="coberturaPrincipal()" (ngModelChange)="coberturaPrincipal.set($event)" rows="1"></textarea>
      </label>
    </section>
    <section class="form-grid">
      <label>Fecha Siniestro
        <input pInputText [ngModel]="fechaSiniestro()" (ngModelChange)="fechaSiniestro.set($event)" />
      </label>
      <label>Ciudad Ocurrencia
        <input pInputText [ngModel]="ciudadOcurrencia()" (ngModelChange)="ciudadOcurrencia.set($event)" />
      </label>
      <label>Causa (Cod)
        <input pInputText [ngModel]="causaCodificada()" (ngModelChange)="causaCodificada.set($event)" />
      </label>
      <label>Intención
        <input pInputText [ngModel]="intencion()" (ngModelChange)="intencion.set($event)" />
      </label>
      <label>Acción
        <input pInputText [ngModel]="accionData()" (ngModelChange)="accionData.set($event)" />
      </label>
      <label>Caso Padre
        <input pInputText [ngModel]="casoPadre()" (ngModelChange)="casoPadre.set($event)" />
      </label>
    </section>
    <section class="form-grid form-grid--full">
      <label>Versión del Siniestro
        <textarea pTextarea [ngModel]="causa()" (ngModelChange)="causa.set($event)" rows="2"></textarea>
      </label>
      <label>Consecuencia
        <textarea pTextarea [ngModel]="consecuencia()" (ngModelChange)="consecuencia.set($event)" rows="1"></textarea>
      </label>
      <label>Observación
        <textarea pTextarea [ngModel]="observacion()" (ngModelChange)="observacion.set($event)" rows="1"></textarea>
      </label>
    </section>
  </p-fluid>
</p-fieldset>
