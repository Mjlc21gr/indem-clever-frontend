<p-fieldset legend="Número del Siniestro">
  <p-message severity="info">Este campo es obligatorio y debe contener 11 dígitos.</p-message>
  <p-fluid>
    <section class="form-grid form-grid--2col">
      <label>Número Siniestro
        <input pInputText [ngModel]="numeroSiniestro()" (ngModelChange)="numeroSiniestro.set($event)" maxlength="11" placeholder="Ej: 12345678901" />
      </label>
      <label>Superó Peso Documentos
        <input pInputText [ngModel]="superoPesoDocumentos()" (ngModelChange)="superoPesoDocumentos.set($event)" [readonly]="true" />
      </label>
    </section>
  </p-fluid>
</p-fieldset>
