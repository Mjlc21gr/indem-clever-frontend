<p-fieldset legend="Datos del Caso" [toggleable]="true">
  <p-fluid>
    <section class="form-grid form-grid--2col">
      <label>Id Clever
        <input pInputText [ngModel]="idClever()" (ngModelChange)="idClever.set($event)" [readonly]="true" />
      </label>
      <label># Caso
        <input pInputText [ngModel]="numCaso()" (ngModelChange)="numCaso.set($event)" />
      </label>
    </section>
    <section class="form-grid">
      <label># Identificación
        <input pInputText [ngModel]="identificacion()" (ngModelChange)="identificacion.set($event)" />
      </label>
      <label>Correo
        <input pInputText type="email" [ngModel]="correo()" (ngModelChange)="correo.set($event)" />
      </label>
      <label>Teléfono
        <input pInputText [ngModel]="telefono()" (ngModelChange)="telefono.set($event)" />
      </label>
    </section>
  </p-fluid>
</p-fieldset>
