<p-fieldset legend="Información Bancaria" [toggleable]="true">
  <p-fluid>
    <section class="form-grid">
      <label>Número de Cuenta
        <input pInputText [ngModel]="numeroCuenta()" (ngModelChange)="numeroCuenta.set($event)" />
      </label>
      <label>Entidad Bancaria
        <input pInputText [ngModel]="entidadBancaria()" (ngModelChange)="entidadBancaria.set($event)" />
      </label>
      <label>Cod. Banco
        <input pInputText [ngModel]="codBanco()" (ngModelChange)="codBanco.set($event)" />
      </label>
      <label>Tipo de Cuenta
        <input pInputText [ngModel]="tipoCuenta()" (ngModelChange)="tipoCuenta.set($event)" />
      </label>
      <label>Aprobación Cta
        <input pInputText [ngModel]="aprobacionCuenta()" (ngModelChange)="aprobacionCuenta.set($event)" />
      </label>
    </section>
  </p-fluid>
</p-fieldset>
