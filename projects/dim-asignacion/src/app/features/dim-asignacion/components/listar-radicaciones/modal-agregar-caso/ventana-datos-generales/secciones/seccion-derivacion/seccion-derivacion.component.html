<p-fieldset legend="Envío y Derivación del Caso">
  <p-checkbox
    [ngModel]="enviarLineaNegocio()"
    (ngModelChange)="enviarLineaNegocio.set($event)"
    [binary]="true"
    label="Enviar este caso directamente a Línea de negocio" />

  <p-divider />

  <label class="form-field-label">¿Desea enviar este caso a proveedores externos?</label>
  <section class="form-radio-group">
    <p-radioButton
      name="enviarProveedores"
      value="si"
      [ngModel]="enviarProveedores()"
      (ngModelChange)="enviarProveedores.set($event)"
      label="Sí" />
    <p-radioButton
      name="enviarProveedores"
      value="no"
      [ngModel]="enviarProveedores()"
      (ngModelChange)="enviarProveedores.set($event)"
      label="No" />
  </section>

  @if (enviarProveedores() === 'si') {
    <p-message severity="info" class="mt-3">Seleccione uno o varios proveedores a los que desea enviar este caso:</p-message>

    <section class="form-checkbox-group">
      <p-checkbox [ngModel]="proveedorInvestigador()" (ngModelChange)="proveedorInvestigador.set($event)" [binary]="true" label="Investigador" />
      <p-checkbox [ngModel]="proveedorUIFA()" (ngModelChange)="proveedorUIFA.set($event)" [binary]="true" label="UIFA" />
      <p-checkbox [ngModel]="proveedorTecnico()" (ngModelChange)="proveedorTecnico.set($event)" [binary]="true" label="Técnico" />
    </section>

    @if (proveedorInvestigador()) {
      <p-fieldset legend="Investigador" class="mt-3 proveedor-fieldset proveedor-fieldset--investigador">
        <p-fluid>
          <section class="form-grid form-grid--2col">
            <label>Agente Investigador <span class="required">*</span>
              <p-select [options]="agentesInvestigador()" [ngModel]="agenteInvestigadorRadi()" (ngModelChange)="agenteInvestigadorRadi.set($event)" placeholder="Seleccionar" />
            </label>
            <label>Tipo de Investigación <span class="required">*</span>
              <p-select [options]="tiposInvestigacion" [ngModel]="motivoMovilizacionInvestigador()" (ngModelChange)="motivoMovilizacionInvestigador.set($event)" optionLabel="label" optionValue="value" placeholder="Seleccionar" />
            </label>
          </section>
        </p-fluid>
      </p-fieldset>
    }

    @if (proveedorUIFA()) {
      <p-fieldset legend="UIFA" class="mt-3 proveedor-fieldset proveedor-fieldset--uifa">
        <p-fluid>
          <label>Motivo de Movilización a UIFA <span class="required">*</span>
            <textarea pTextarea [ngModel]="motivoMovilizacionUIFA()" (ngModelChange)="motivoMovilizacionUIFA.set($event)" rows="3" placeholder="Describa el motivo..."></textarea>
          </label>
        </p-fluid>
      </p-fieldset>
    }

    @if (proveedorTecnico()) {
      <p-fieldset legend="Técnico" class="mt-3 proveedor-fieldset proveedor-fieldset--tecnico">
        <p-fluid>
          <section class="form-grid form-grid--2col">
            <label>Agente Técnico <span class="required">*</span>
              <p-select [options]="agentesTecnico()" [ngModel]="agenteTecnicoRadi()" (ngModelChange)="agenteTecnicoRadi.set($event)" placeholder="Seleccionar" />
            </label>
            <label>Motivo de Movilización <span class="required">*</span>
              <textarea pTextarea [ngModel]="motivoMovilizacionTecnico()" (ngModelChange)="motivoMovilizacionTecnico.set($event)" rows="3" placeholder="Describa el motivo..."></textarea>
            </label>
          </section>
        </p-fluid>
      </p-fieldset>
    }
  }
</p-fieldset>
