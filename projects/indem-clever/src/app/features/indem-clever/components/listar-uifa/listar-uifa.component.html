<div class="page-panel">
  <div class="page-panel__header">UIFA</div>
  <div class="page-panel__body">
    <app-tabla-dinamica
      [columnas]="columnas"
      [datos]="data()"
      [loading]="loading()"
      [showActions]="true"
      [acciones]="acciones"
      (accionEjecutada)="onAccion($event)" />
  </div>
</div>
<app-modal-uifa [visible]="showModal()" (onClose)="closeModal()" />
