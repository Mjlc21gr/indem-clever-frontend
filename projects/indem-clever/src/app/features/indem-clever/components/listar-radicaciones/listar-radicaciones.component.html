<div class="page-panel">
  <div class="page-panel__header">
    <span>Radicaciones</span>
    <div style="display: flex; gap: 0.5rem; flex-wrap: wrap">
      <button class="sb-ui-button sb-ui-button--primary sb-ui-button--fill sb-ui-button--small sb-ui-button--icon-left" (click)="openAgregarCaso()">
        <i class="fa-solid fa-plus"></i> Agregar Caso
      </button>
      <button class="sb-ui-button sb-ui-button--secondary sb-ui-button--small sb-ui-button--icon-left" (click)="openMesaPerfeccionamiento()">
        <i class="fa-solid fa-arrows-rotate"></i> Mesa de Perfeccionamiento
      </button>
    </div>
  </div>
  <div class="page-panel__body">
    <app-tabla-dinamica
      [columnas]="columnas"
      [datos]="data()"
      [loading]="loading()"
      [showActions]="true"
      [acciones]="acciones"
      (accionEjecutada)="onAccion($event)" />
  </div>
</div>

<app-modal-agregar-caso
  [visible]="showModalAgregarCaso()"
  (onClose)="closeAgregarCaso()" />

<app-modal-mesa-perfeccionamiento
  [visible]="showModalMesaPerfeccionamiento()"
  (onClose)="closeMesaPerfeccionamiento()" />

<app-modal-radicacion
  [visible]="showModalRadicacion()"
  (onClose)="closeRadicacion()" />
