@if (visible()) {
  <div class="modal-overlay" [class.modal-overlay--maximized]="maximized" (click)="maximized ? null : close()">
    <div class="modal-container" [class.modal-container--maximized]="maximized" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <span class="modal-header__title">Radicaciones</span>
        <div class="modal-header__actions">
          <button class="modal-header__btn" (click)="toggleMaximize()" [title]="maximized ? 'Restaurar' : 'Maximizar'">
            <i [class]="maximized ? 'fa-solid fa-compress' : 'fa-solid fa-expand'"></i>
          </button>
          <button class="modal-header__btn" (click)="close()"><i class="fa-solid fa-xmark"></i></button>
        </div>
      </div>
      <div class="modal-body">
        <nav class="sb-ui-tabs sb-ui-tabs--track">
          <button class="sb-ui-tabs__item" [class.sb-ui-tabs__item--active]="activeTab() === '0'" (click)="activeTab.set('0')">
            <span class="sb-ui-tabs__title">Datos Generales</span>
          </button>
          <button class="sb-ui-tabs__item" [class.sb-ui-tabs__item--active]="activeTab() === '1'" (click)="activeTab.set('1')">
            <span class="sb-ui-tabs__title">Data Operativa</span>
          </button>
        </nav>

        @if (activeTab() === '0') {
          <app-ventana-datos-generales
            [(observacionRadicado)]="observacionRadicado"
            (filesSelected)="onFileUpload($event)" />
        }

        @if (activeTab() === '1') {
          <app-ventana-data-operativa
            [(consultaTipoDoc)]="consultaTipoDoc"
            [(consultaNumDoc)]="consultaNumDoc" />
        }

        <hr style="border: none; border-top: 1px solid var(--app-border); margin: 0.75rem 0" />

        <app-seccion-derivacion
          [(enviarProveedores)]="enviarProveedores"
          [(enviarLineaNegocio)]="enviarLineaNegocio"
          [(proveedorInvestigador)]="proveedorInvestigador"
          [(proveedorUIFA)]="proveedorUIFA"
          [(proveedorTecnico)]="proveedorTecnico"
          [(agentesInvestigador)]="agentesInvestigador"
          [(agentesTecnico)]="agentesTecnico"
          [(agenteInvestigadorRadi)]="agenteInvestigadorRadi"
          [(motivoMovilizacionInvestigador)]="motivoMovilizacionInvestigador"
          [(motivoMovilizacionUIFA)]="motivoMovilizacionUIFA"
          [(agenteTecnicoRadi)]="agenteTecnicoRadi"
          [(motivoMovilizacionTecnico)]="motivoMovilizacionTecnico" />
      </div>
      <div class="modal-footer">
        <app-boton-accion label="Anular caso" icon="fa-solid fa-ban" severity="danger" [outlined]="true" (accion)="anularCaso()" />
        <app-boton-accion label="Cerrar" icon="fa-solid fa-xmark" severity="secondary" (accion)="close()" />
        <app-boton-accion label="Guardar Radicado" icon="fa-solid fa-floppy-disk" severity="success" (accion)="guardarRadicado()" />
      </div>
    </div>
  </div>
}
