<div class="page-panel">
  <div class="page-panel__header">Objeciones</div>
  <div class="page-panel__body">
    <app-tabla-dinamica
      [columnas]="columnas"
      [datos]="data()"
      [loading]="loading()"
      [showActions]="true"
      [acciones]="acciones"
      (accionEjecutada)="onAccion($event)" />
  </div>
</div>

<app-modal-objecion [visible]="showModal()" (onClose)="closeModal()" />

<app-dialogo-confirmacion
  [visible]="showConfirm()"
  [titulo]="confirmTitulo()"
  [mensaje]="confirmMensaje()"
  [labelConfirmar]="confirmLabel()"
  [severityConfirmar]="confirmSeverity()"
  (confirmar)="onConfirmar()"
  (cancelar)="onCancelar()" />
