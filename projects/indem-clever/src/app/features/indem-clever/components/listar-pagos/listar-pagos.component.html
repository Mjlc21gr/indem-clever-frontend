<div class="page-panel">
  <div class="page-panel__header">
    <span>Órdenes de Pago</span>
    <div style="display: flex; gap: 0.5rem; flex-wrap: wrap">
      <button class="sb-ui-button sb-ui-button--primary sb-ui-button--fill sb-ui-button--small sb-ui-button--icon-left" (click)="confirmarMasivo('aprobar')">
        <i class="fa-solid fa-check"></i> Aprobar seleccionados
      </button>
      <button class="sb-ui-button sb-ui-button--secondary sb-ui-button--small sb-ui-button--icon-left" (click)="confirmarMasivo('devolver')">
        <i class="fa-solid fa-rotate-left"></i> Devolver seleccionados
      </button>
    </div>
  </div>
  <div class="page-panel__body">
    <app-tabla-dinamica
      [columnas]="columnas"
      [datos]="data()"
      [loading]="loading()"
      [showActions]="true"
      [acciones]="acciones"
      [selectable]="true"
      selectionMode="multiple"
      (accionEjecutada)="onAccion($event)" />
  </div>
</div>

<app-modal-pago [visible]="showModal()" (onClose)="closeModal()" />

<app-dialogo-confirmacion
  [visible]="showConfirm()"
  [titulo]="confirmTitulo()"
  [mensaje]="confirmMensaje()"
  [labelConfirmar]="confirmLabel()"
  [severityConfirmar]="confirmSeverity()"
  (confirmar)="onConfirmar()"
  (cancelar)="onCancelar()" />
