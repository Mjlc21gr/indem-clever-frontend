<div class="section-card">
  <div class="section-card__header">
    <span class="section-card__title">Envío y Derivación del Caso</span>
  </div>
  <div class="section-card__body">
    <label class="sb-ui-checkbox" style="margin-bottom: 0.75rem">
      <input type="checkbox" class="sb-ui-checkbox__input" [(ngModel)]="enviarLineaNegocio" />
      <span class="sb-ui-checkbox__box"></span>
      <span class="sb-ui-checkbox__label">Enviar este caso directamente a Línea de negocio</span>
    </label>

    <hr style="border: none; border-top: 1px solid #e1e1e1; margin: 0.75rem 0" />

    <div class="sb-ui-input-container" style="margin-bottom: 0.75rem">
      <label class="sb-ui-input-label">¿Desea enviar este caso a proveedores externos?</label>
      <div style="display: flex; gap: 1.5rem; margin-top: 0.5rem">
        <label class="sb-ui-radio">
          <input type="radio" class="sb-ui-radio__input" name="enviarProveedores" value="si" [(ngModel)]="enviarProveedores" />
          <span class="sb-ui-radio__circle"></span>
          <span>Sí</span>
        </label>
        <label class="sb-ui-radio">
          <input type="radio" class="sb-ui-radio__input" name="enviarProveedores" value="no" [(ngModel)]="enviarProveedores" />
          <span class="sb-ui-radio__circle"></span>
          <span>No</span>
        </label>
      </div>
    </div>

    @if (enviarProveedores() === 'si') {
      <div class="sb-ui-alert sb-ui-alert--info" style="margin-bottom: 0.75rem">
        Seleccione uno o varios proveedores a los que desea enviar este caso:
      </div>

      <div style="display: flex; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 0.75rem">
        <label class="sb-ui-checkbox"><input type="checkbox" class="sb-ui-checkbox__input" [(ngModel)]="proveedorInvestigador" /><span class="sb-ui-checkbox__box"></span><span class="sb-ui-checkbox__label">Investigador</span></label>
        <label class="sb-ui-checkbox"><input type="checkbox" class="sb-ui-checkbox__input" [(ngModel)]="proveedorUIFA" /><span class="sb-ui-checkbox__box"></span><span class="sb-ui-checkbox__label">UIFA</span></label>
        <label class="sb-ui-checkbox"><input type="checkbox" class="sb-ui-checkbox__input" [(ngModel)]="proveedorTecnico" /><span class="sb-ui-checkbox__box"></span><span class="sb-ui-checkbox__label">Técnico</span></label>
      </div>

      @if (proveedorInvestigador()) {
        <div class="section-card" style="margin-top: 0.75rem; border-left: 4px solid #6c757d">
          <div class="section-card__header"><span class="section-card__title">Investigador</span></div>
          <div class="section-card__body">
            <div class="form-grid form-grid--2col">
              <div class="sb-ui-input-container">
                <label class="sb-ui-input-label">Agente Investigador <span class="required">*</span></label>
                <select class="sb-ui-select" [(ngModel)]="agenteInvestigadorRadi">
                  <option value="">Seleccionar</option>
                  @for (a of agentesInvestigador(); track a.value) {
                    <option [value]="a.value">{{ a.label }}</option>
                  }
                </select>
              </div>
              <div class="sb-ui-input-container">
                <label class="sb-ui-input-label">Tipo de Investigación <span class="required">*</span></label>
                <select class="sb-ui-select" [(ngModel)]="motivoMovilizacionInvestigador">
                  @for (t of tiposInvestigacion; track t.value) {
                    <option [value]="t.value">{{ t.label }}</option>
                  }
                </select>
              </div>
            </div>
          </div>
        </div>
      }

      @if (proveedorUIFA()) {
        <div class="section-card" style="margin-top: 0.75rem; border-left: 4px solid #17a2b8">
          <div class="section-card__header"><span class="section-card__title">UIFA</span></div>
          <div class="section-card__body">
            <div class="sb-ui-input-container">
              <label class="sb-ui-input-label">Motivo de Movilización a UIFA <span class="required">*</span></label>
              <textarea class="sb-ui-textarea" [(ngModel)]="motivoMovilizacionUIFA" rows="3" placeholder="Describa el motivo..." style="width: 100%"></textarea>
            </div>
          </div>
        </div>
      }

      @if (proveedorTecnico()) {
        <div class="section-card" style="margin-top: 0.75rem; border-left: 4px solid var(--app-gold)">
          <div class="section-card__header"><span class="section-card__title">Técnico</span></div>
          <div class="section-card__body">
            <div class="form-grid form-grid--2col">
              <div class="sb-ui-input-container">
                <label class="sb-ui-input-label">Agente Técnico <span class="required">*</span></label>
                <select class="sb-ui-select" [(ngModel)]="agenteTecnicoRadi">
                  <option value="">Seleccionar</option>
                  @for (a of agentesTecnico(); track a.value) {
                    <option [value]="a.value">{{ a.label }}</option>
                  }
                </select>
              </div>
              <div class="sb-ui-input-container">
                <label class="sb-ui-input-label">Motivo de Movilización <span class="required">*</span></label>
                <textarea class="sb-ui-textarea" [(ngModel)]="motivoMovilizacionTecnico" rows="3" placeholder="Describa el motivo..." style="width: 100%"></textarea>
              </div>
            </div>
          </div>
        </div>
      }
    }
  </div>
</div>
