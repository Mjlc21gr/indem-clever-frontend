<div class="section-card">
  <div class="section-card__header">
    <span class="section-card__title">Análisis de Terceros</span>
  </div>
  <div class="section-card__body">
    <p class="text-muted">No hay historial de gestiones registradas.</p>
    <hr style="border: none; border-top: 1px solid #e1e1e1; margin: 0.75rem 0" />
    <div class="form-grid form-grid--2col">
      <div class="sb-ui-input-container">
        <label class="sb-ui-input-label">Tomar Decisión</label>
        <select class="sb-ui-select" [(ngModel)]="nuevoEstado">
          @for (opt of opcionesDecision; track opt.value) {
            <option [value]="opt.value">{{ opt.label }}</option>
          }
        </select>
      </div>
      <div class="sb-ui-input-container">
        <label class="sb-ui-input-label">Causal Abordada</label>
        <select class="sb-ui-select" [(ngModel)]="causalAbordada">
          @for (opt of opcionesCausal; track opt.value) {
            <option [value]="opt.value">{{ opt.label }}</option>
          }
        </select>
      </div>
    </div>
    <hr style="border: none; border-top: 1px solid #e1e1e1; margin: 0.75rem 0" />
    <app-seccion-observaciones-generica
      legend="Observaciones del Analista"
      [(valor)]="observacionAnalista" />
  </div>
</div>
