<div class="section-card">
  <div class="section-card__header">
    <span class="section-card__title">Checklist de Documentos</span>
  </div>
  <div class="section-card__body">
    <div class="checklist-grid">
      <label class="sb-ui-checkbox"><input type="checkbox" class="sb-ui-checkbox__input" [(ngModel)]="regCivilDefuncion" /><span class="sb-ui-checkbox__box"></span><span class="sb-ui-checkbox__label">Registro civil de defunción</span></label>
      <label class="sb-ui-checkbox"><input type="checkbox" class="sb-ui-checkbox__input" [(ngModel)]="docIdentidadAsegurado" /><span class="sb-ui-checkbox__box"></span><span class="sb-ui-checkbox__label">Documento de identidad asegurado</span></label>
      <label class="sb-ui-checkbox"><input type="checkbox" class="sb-ui-checkbox__input" [(ngModel)]="epicrisis" /><span class="sb-ui-checkbox__box"></span><span class="sb-ui-checkbox__label">Epicrisis o historia clínica</span></label>
      <label class="sb-ui-checkbox"><input type="checkbox" class="sb-ui-checkbox__input" [(ngModel)]="certFiscalia" /><span class="sb-ui-checkbox__box"></span><span class="sb-ui-checkbox__label">Certificado de la fiscalía</span></label>
      <label class="sb-ui-checkbox"><input type="checkbox" class="sb-ui-checkbox__input" [(ngModel)]="sentenciaFecha" /><span class="sb-ui-checkbox__box"></span><span class="sb-ui-checkbox__label">Sentencia fecha presuntiva</span></label>
      <label class="sb-ui-checkbox"><input type="checkbox" class="sb-ui-checkbox__input" [(ngModel)]="croquis" /><span class="sb-ui-checkbox__box"></span><span class="sb-ui-checkbox__label">Croquís del accidente</span></label>
      <label class="sb-ui-checkbox"><input type="checkbox" class="sb-ui-checkbox__input" [(ngModel)]="dictamenCapacidad" /><span class="sb-ui-checkbox__box"></span><span class="sb-ui-checkbox__label">Dictamen pérdida capacidad</span></label>
      <label class="sb-ui-checkbox"><input type="checkbox" class="sb-ui-checkbox__input" [(ngModel)]="regCivilBeneficiarios" /><span class="sb-ui-checkbox__box"></span><span class="sb-ui-checkbox__label">Registro civil beneficiarios</span></label>
      <label class="sb-ui-checkbox"><input type="checkbox" class="sb-ui-checkbox__input" [(ngModel)]="docBeneficiarios" /><span class="sb-ui-checkbox__box"></span><span class="sb-ui-checkbox__label">Documento beneficiarios</span></label>
      <label class="sb-ui-checkbox"><input type="checkbox" class="sb-ui-checkbox__input" [(ngModel)]="formB114" /><span class="sb-ui-checkbox__box"></span><span class="sb-ui-checkbox__label">Formulario B-114</span></label>
      <label class="sb-ui-checkbox"><input type="checkbox" class="sb-ui-checkbox__input" [(ngModel)]="formB121" /><span class="sb-ui-checkbox__box"></span><span class="sb-ui-checkbox__label">Formulario B-121</span></label>
      <label class="sb-ui-checkbox"><input type="checkbox" class="sb-ui-checkbox__input" [(ngModel)]="certHospitalizacion" /><span class="sb-ui-checkbox__box"></span><span class="sb-ui-checkbox__label">Certificado hospitalización (Opcional)</span></label>
      <label class="sb-ui-checkbox"><input type="checkbox" class="sb-ui-checkbox__input" [(ngModel)]="certIncapacidad" /><span class="sb-ui-checkbox__box"></span><span class="sb-ui-checkbox__label">Certificado incapacidad (Opcional)</span></label>
      <label class="sb-ui-checkbox"><input type="checkbox" class="sb-ui-checkbox__input" [(ngModel)]="examenesDiagnostico" /><span class="sb-ui-checkbox__box"></span><span class="sb-ui-checkbox__label">Exámenes diagnóstico</span></label>
      <label class="sb-ui-checkbox"><input type="checkbox" class="sb-ui-checkbox__input" [(ngModel)]="formB337" /><span class="sb-ui-checkbox__box"></span><span class="sb-ui-checkbox__label">Formulario B-337</span></label>
      <label class="sb-ui-checkbox"><input type="checkbox" class="sb-ui-checkbox__input" [(ngModel)]="pruebaAlcoholemia" /><span class="sb-ui-checkbox__box"></span><span class="sb-ui-checkbox__label">Prueba alcoholemia</span></label>
      <label class="sb-ui-checkbox"><input type="checkbox" class="sb-ui-checkbox__input" [(ngModel)]="reciboFactura" /><span class="sb-ui-checkbox__box"></span><span class="sb-ui-checkbox__label">Recibo o Factura</span></label>
      <label class="sb-ui-checkbox"><input type="checkbox" class="sb-ui-checkbox__input" [(ngModel)]="certDeuda" /><span class="sb-ui-checkbox__box"></span><span class="sb-ui-checkbox__label">Certificado Deuda</span></label>
    </div>
  </div>
</div>
