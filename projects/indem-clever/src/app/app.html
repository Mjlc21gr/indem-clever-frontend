<app-topbar
  [userName]="userName()"
  (toggleSidebar)="toggleSidebar()" />

@if (!isMobile()) {
  <app-sidebar [collapsed]="sidebarCollapsed()" />
}

@if (isMobile() && sidebarMobileOpen()) {
  <div class="mobile-backdrop" (click)="closeMobileSidebar()"></div>
  <app-sidebar
    [collapsed]="false"
    (itemSelected)="closeMobileSidebar()"
    class="mobile-sidebar" />
}

<main
  class="app-main"
  [class.app-main--collapsed]="!isMobile() && sidebarCollapsed()"
  [class.app-main--mobile]="isMobile()">
  <router-outlet />
</main>
